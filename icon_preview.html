<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Preview</title>
    <style>
        body { font-family: Arial; background: #f5f5f5; text-align: center; padding: 20px; }
        .container { display: inline-block; background: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .icon-large { width: 300px; height: 300px; border-radius: 50px; object-fit: cover; }
        .icon-small { width: 100px; height: 100px; border-radius: 20px; object-fit: cover; margin: 10px; }
        .icon-tiny { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; margin: 10px; }
        h1 { color: #333; font-size: 24px; }
        p { color: #666; }
        .row { display: flex; justify-content: center; align-items: flex-end; gap: 20px; }
        .label { font-size: 12px; color: #999; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>Construction Manager Icon Preview</h1>
    <div class="container">
        <img src="icon_preview.png" class="icon-large" alt="Icon">
        <p>Full size (300x300)</p>
    </div>
    <h2>How it looks at different sizes</h2>
    <div class="row">
        <div>
            <img src="icon_preview.png" class="icon-small" alt="Small icon">
            <div class="label">100x100 (Home screen)</div>
        </div>
        <div>
            <img src="icon_preview.png" class="icon-tiny" alt="Tiny icon">
            <div class="label">48x48 (Notification)</div>
        </div>
    </div>
</body>
</html>
